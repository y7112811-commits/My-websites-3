<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatingFly by y@$h</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* Liquid Animated Background */
        @keyframes liquidBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Kept the dark deep space liquid background to make the pink pop! */
            background: linear-gradient(-45deg, #1a0014, #2a0845, #140024, #3d002e);
            background-size: 400% 400%;
            animation: liquidBg 12s ease infinite;
            color: #fff; 
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glassmorphism Container */
        .glass-container {
            width: 100%;
            max-width: 500px;
            background: rgba(40, 10, 40, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Branding Header - Now Pink */
        h2 {
            margin: 0 0 5px 0;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #ff4081, #f8bbd0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(255, 64, 129, 0.3);
        }

        .branding {
            display: block;
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #f48fb1;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Inputs & Buttons - Now Pink */
        label {
            font-size: 13px;
            color: #f8bbd0;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }

        input, button { 
            padding: 14px; 
            margin-bottom: 15px; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 12px; 
            border: none; 
            outline: none;
            transition: all 0.3s ease;
        }

        input { 
            background: rgba(0, 0, 0, 0.3); 
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 15px;
        }

        input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #ff4081;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.4);
        }

        button { 
            background: linear-gradient(135deg, #d81b60, #ff4081); 
            color: white; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Chat Box & Watermark */
        #chat-box { 
            height: 320px; 
            overflow-y: auto; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Liquid Scrollbar - Now Pink */
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: #d81b60; border-radius: 10px; }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            white-space: nowrap;
            user-select: none;
            z-index: 0;
        }

        /* Messages - Now Pink Glass */
        .msg { 
            padding: 12px 16px; 
            border-radius: 12px; 
            background: rgba(216, 27, 96, 0.5); 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 1;
            line-height: 1.4;
            max-width: 85%;
            word-wrap: break-word;
        }
        
        .msg-you {
            align-self: flex-end;
            background: rgba(255, 64, 129, 0.4);
            border-bottom-right-radius: 2px;
        }

        .msg-friend {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 2px;
        }

        .system { 
            color: #f48fb1; 
            font-size: 11px; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0;
            z-index: 1;
        }

        /* Dividers */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h2>ChatingFly</h2>
        <span class="branding">by y@$h</span>

        <div id="setup">
            <label>1. Create Your ID (Any word or number):</label>
            <input type="text" id="my-id" placeholder="e.g., yash123">
            <button onclick="startMyServer()">Start My Node</button>
        </div>

        <div id="connect-section" style="display:none;">
            <div class="divider"></div>
            <label>2. Connect to a Friend's ID:</label>
            <input type="text" id="friend-id" placeholder="Enter their exact ID">
            <button onclick="connectToFriend()">Connect</button>
        </div>

        <div id="chat-section" style="display:none;">
            <div class="divider"></div>
            <div id="chat-box">
                <div class="watermark">by y@$h</div>
                <!-- Messages will appear here -->
            </div>
            <input type="text" id="msg-input" placeholder="Type a liquid message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send Message</button>
        </div>
    </div>

    <script>
        let peer = null;
        let activeConnection = null;

        // 1. Initialize your node
        function startMyServer() {
            const myId = document.getElementById('my-id').value.trim();
            if (!myId) return alert("Enter an ID first!");

            peer = new Peer(myId, { debug: 2 }); 

            peer.on('open', (id) => {
                logMessage(`System: You are online as "${id}"`, 'system');
                document.getElementById('setup').style.display = 'none';
                document.getElementById('connect-section').style.display = 'block';
                document.getElementById('chat-section').style.display = 'block';
            });

            // Listen for someone connecting to YOU
            peer.on('connection', (conn) => {
                activeConnection = conn;
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                alert("Error: " + err.type + " - Try a different ID.");
            });
        }

        // 2. Connect to someone else
        function connectToFriend() {
            const friendId = document.getElementById('friend-id').value.trim();
            if (!friendId) return alert("Enter a friend's ID!");

            logMessage(`System: Attempting to connect to ${friendId}...`, 'system');
            activeConnection = peer.connect(friendId, { reliable: true });
            setupConnection(activeConnection);
        }

        // 3. Handle data passing back and forth
        function setupConnection(conn) {
            conn.on('open', () => {
                logMessage(`System: Connected securely to ${conn.peer}!`, 'system');
            });

            conn.on('data', (data) => {
                logMessage(`Friend: ${data}`, 'friend');
            });

            conn.on('close', () => {
                logMessage(`System: Connection closed.`, 'system');
                activeConnection = null;
            });
        }

        // 4. Send the message
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            
            if (!text) return;
            if (!activeConnection || !activeConnection.open) {
                return alert("No active connection. Connect to a friend first.");
            }

            activeConnection.send(text);
            logMessage(`You: ${text}`, 'you');
            input.value = '';
        }

        // 5. Print to screen
        function logMessage(text, type = '') {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            
            if (type === 'system') {
                div.className = 'system';
            } else if (type === 'you') {
                div.className = 'msg msg-you';
            } else if (type === 'friend') {
                div.className = 'msg msg-friend';
            } else {
                div.className = 'msg';
            }
            
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
