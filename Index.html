<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>y@$h One World Notebook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@500&family=Patrick+Hand&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');

*{margin:0; padding:0; box-sizing:border-box;}
body{
  background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fecfef 100%);
  background-size:400% 400%;
  animation:gradientShift 8s ease infinite;
  display:flex; justify-content:center; align-items:flex-start; flex-direction:column;
  min-height:100vh; padding:120px 20px 40px; font-family:'Kalam', cursive;
}
@keyframes gradientShift{
 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
}

/* LIQUID GLASS TOOLBAR - NEON */
.toolbar{
  position:fixed; top:15px; left:50%; transform:translateX(-50%);
  width:90%; max-width:1100px; 
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(25px) saturate(200%); 
  border:2px solid rgba(255,255,255,0.4);
  border-radius:20px; padding:14px 20px; display:flex; gap:10px; flex-wrap:wrap; z-index:100;
  box-shadow:0 0 30px rgba(255,105,180,0.5);
}
.toolbar button, .toolbar select{
  border:1px solid rgba(255,255,255,0.5); 
  background:linear-gradient(135deg,rgba(255,255,255,0.3),rgba(255,255,255,0.1)); 
  color:#fff; font-weight:700; text-shadow:0 0 5px rgba(0,0,0,0.3);
  padding:10px 16px; border-radius:12px; cursor:pointer; font-size:14px;
  font-family:'Poppins', sans-serif; transition:0.3s;
}
.toolbar button:hover{
  background:linear-gradient(135deg,#ff6ec4,#7873f5);
  transform:scale(1.05) translateY(-2px);
  box-shadow:0 0 20px rgba(255,110,196,0.8)
}
.toolbar select{color:#333; background:rgba(255,255,255,0.9)}

#notebook{width:800px; max-width:100%; margin:0 auto;}

/* BRIGHT NOTEBOOK PAGE */
.page{
  width:100%; min-height:1050px; 
  background:#fffdfa; 
  box-shadow:0 0 40px rgba(255,105,180,0.4), 0 20px 60px rgba(0,0,0,0.3);
  position:relative; padding:60px 80px 80px 120px; border-radius:12px; margin-bottom:40px;
  border:3px solid rgba(255,182,193,0.5);
  
  /* BRIGHT Notebook lines + pink margin line */
  background-image: 
    linear-gradient(to right, #ff80ab 3px, transparent 3px),
    repeating-linear-gradient(#fffdfa, #fffdfa 31px, #b3e5fc 32px);
  background-size: 100% 100%, 100% 32px;
  background-position: 90px 0, 0 60px;
}

/* BRIGHT WATERMARK */
.watermark{
  position:absolute; top:50%; left:55%; transform:translate(-50%,-50%) rotate(-25deg);
  font-size:130px; 
  background:linear-gradient(135deg,#ff6ec4,#7873f5);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  font-weight:900; font-family:'Poppins'; pointer-events:none; z-index:0; opacity:0.12;
}

/* BRIGHT Hole punches */
.page::before{
  content:''; position:absolute; left:28px; top:78px; width:24px; height:24px; 
  background:radial-gradient(circle, #fff 30%, #ff80ab 100%);
  border-radius:50%; box-shadow:0 0 10px rgba(255,128,171,0.6);
  box-shadow:0 150px 0 radial-gradient, 0 300px 0 radial-gradient, 0 450px 0 radial-gradient, 0 600px 0 radial-gradient, 0 750px 0 radial-gradient;
}

/* Editable area - BRIGHT INK */
.editor{
  position:relative; z-index:1; width:100%; min-height:900px; outline:none; border:none;
  background:transparent; font-size:21px; line-height:32px; 
  color:#2d1b69; /* Dark purple ink */
  font-family:'Kalam', cursive;
}
.editor a{color:#d500f9; text-decoration:underline; font-weight:700;}
.editor a:hover{color:#ff00ff; text-shadow:0 0 5px rgba(213,0,249,0.5);}

/* Page number */
.pageNum{
  position:absolute; bottom:30px; right:80px; font-size:15px; color:#7b1fa2; 
  font-family:'Poppins'; font-weight:700;
}

/* HANDWRITING BRANDING - GLOW */
.write-corner-brand{
  position:absolute; bottom:25px; right:25px; font-size:15px; 
  background:linear-gradient(135deg,#ff6ec4,#7873f5);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  font-family:'Kalam', cursive; font-weight:800; letter-spacing:1.5px; 
  padding:8px 14px; border:2px dashed rgba(255,110,196,0.4); border-radius:25px;
  transform:rotate(-3deg); filter:drop-shadow(0 0 5px rgba(255,110,196,0.5));
}

/* ===== PRINT FIX ===== */
@media print{
  body{background:white; padding:0;}
  .toolbar{display:none;}
  .page{box-shadow:none; margin:0 0 20px 0; page-break-after:always; -webkit-print-color-adjust: exact; print-color-adjust: exact; border:1px solid #ccc;}
  .editor{font-family:'Kalam', cursive !important; font-size:18px; line-height:32px; color:#000;}
  @page {margin: 0.5in;}
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="addPage()">+ New Page</button>
  <button onclick="document.execCommand('bold')"><b>B</b></button>
  <button onclick="document.execCommand('italic')"><i>I</i></button>
  <button onclick="document.execCommand('underline')"><u>U</u></button>
  <select onchange="document.execCommand('fontName',false,this.value)">
    <option>Kalam</option><option>Caveat</option><option>Patrick Hand</option><option>Arial</option>
  </select>
  <button onclick="let url=prompt('Enter URL:');document.execCommand('createLink',false,url)">🔗 Link</button>
  <button onclick="window.print()">🖨️ Print All</button>
</div>

<div id="notebook">
  <div class="page">
    <div class="watermark">y@$h</div>
    <div class="editor" contenteditable="true">
      <h2>✨ My Bright One World Page ✨</h2><br>
      Now notebook is bright and attractive!<br><br>
      Pink margin line, blue ruled lines, aur gradient background.<br><br>
      This is a <a href="https://google.com">glowing link</a>.<br><br>
      Handwriting in dark purple ink looks premium.<br><br>
    </div>
    <div class="pageNum">Page 1</div>
    <div class="write-corner-brand">made by y@$h notebook world</div>
  </div>
</div>

<script>
let pageCount = 1;
function addPage(){
  pageCount++;
  const notebook = document.getElementById('notebook');
  const newPage = document.createElement('div');
  newPage.className = 'page';
  newPage.innerHTML = `
    <div class="watermark">y@$h</div>
    <div class="editor" contenteditable="true"><br><br>Page ${pageCount} - Start writing with bright colors...</div>
    <div class="pageNum">Page ${pageCount}</div>
    <div class="write-corner-brand">made by y@$h notebook world</div>
  `;
  notebook.appendChild(newPage);
  newPage.querySelector('.editor').focus();
  saveData();
}
function saveData(){ localStorage.setItem('yashNotebook', document.getElementById('notebook').innerHTML); }
document.addEventListener('input', saveData);
window.onload = () => {
  const saved = localStorage.getItem('yashNotebook');
  if(saved) { document.getElementById('notebook').innerHTML = saved; pageCount = document.querySelectorAll('.page').length; }
}
</script>
</body>
</html>
