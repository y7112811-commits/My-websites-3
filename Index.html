<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Y@$H OS - Real Android/Mac OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  overflow:hidden;
  height:100vh;
  user-select:none;
  background:#000;
}

/* REAL BOOT SCREEN - Static like real phone */
.boot-screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
.boot-screen.hide{
  animation:bootOut 0.5s ease forwards;
}
@keyframes bootOut{
  to{opacity:0;visibility:hidden;}
}

.boot-logo{
  font-size:100px;
  font-weight:900;
  color:#fff;
  letter-spacing:-4px;
  margin-bottom:20px;
}
.boot-logo .at{
  color:#0099FF;
  text-shadow:0 0 40px rgba(0,153,255,0.8);
}
.boot-logo .dollar{
  color:#FFD700;
  text-shadow:0 0 30px rgba(255,215,0,0.8);
}

.boot-powered{
  position:absolute;
  bottom:50px;
  color:rgba(255,255,255,0.4);
  font-size:12px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* BMW M4 WALLPAPER */
.wallpaper{
  position:fixed;
  inset:0;
  background:url('https://images.unsplash.com/photo-1555215695-3004980ad54e?w=1920&q=80') center/cover no-repeat;
  z-index:0;
}
.wallpaper::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.1) 50%,rgba(0,0,0,0.4) 100%);
}

/* MAC OS MENU BAR - Desktop */
.menu-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:28px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  font-size:13px;
  color:#fff;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.menu-left{display:flex;align-items:center;gap:20px;}
.apple-logo{font-size:16px;cursor:pointer;}
.menu-item{cursor:pointer;opacity:0.9;font-weight:500;}
.menu-item:hover{opacity:1;}
.menu-right{font-size:12px;font-weight:600;}
.menu-time{text-shadow:0 1px 2px rgba(0,0,0,0.5);}

/* iPHONE STATUS BAR - Mobile */
.ios-status{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:44px;
  display:none;
  align-items:center;
  justify-content:center;
  padding-top:env(safe-area-inset-top);
  color:#fff;
  font-size:17px;
  font-weight:600;
  z-index:1000;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);
}

/* DESKTOP AREA - Apps Spread Like Real OS */
.desktop{
  position:relative;
  height:100vh;
  padding-top:40px;
  padding-bottom:80px;
  z-index:10;
}

/* App Icons Spread on Desktop */
.app-icon{
  position:absolute;
  width:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:all 0.2s ease;
}
.app-icon:active{
  transform:scale(0.9);
}

.icon-img{
  width:60px;
  height:60px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
  margin-bottom:8px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.2);
}

.app-name{
  color:#fff;
  font-size:12px;
  font-weight:600;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
  text-align:center;
  max-width:80px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* App Positions - Spread Like Real Desktop */
.app-icon:nth-child(1){top:60px;left:40px;}
.app-icon:nth-child(2){top:60px;left:150px;}
.app-icon:nth-child(3){top:60px;left:260px;}
.app-icon:nth-child(4){top:60px;left:370px;}
.app-icon:nth-child(5){top:180px;left:40px;}
.app-icon:nth-child(6){top:180px;left:150px;}
.app-icon:nth-child(7){top:180px;left:260px;}
.app-icon:nth-child(8){top:180px;left:370px;}

.youtube{background:linear-gradient(135deg,#FF0000,#CC0000);}
.google{background:#fff;color:#4285F4;font-weight:bold;font-size:36px;}
.instagram{background:linear-gradient(135deg,#833AB4,#FD1D1D,#FCAF45);}
.chat{background:linear-gradient(135deg,#22c55e,#16a34a);}
.whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);}
.twitter{background:linear-gradient(135deg,#1DA1F2,#0d8bd9);}
.github{background:linear-gradient(135deg,#333,#000);}
.netflix{background:linear-gradient(135deg,#E50914,#B20710);}

/* MAC OS DOCK - Desktop */
.dock{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(40,40,40,0.35);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:22px;
  padding:10px 20px;
  display:flex;
  gap:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.2);
  z-index:999;
}
.dock-icon{
  width:55px;
  height:55px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.dock-icon:hover{
  transform:scale(1.3) translateY(-10px);
}
.dock-icon:active{
  transform:scale(1.1) translateY(-5px);
}

/* ANDROID NAVIGATION BAR - 3 Dot */
.android-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:48px;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(20px);
  display:none;
  align-items:center;
  justify-content:space-around;
  z-index:1001;
  padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid rgba(255,255,255,0.1);
}
.nav-btn{
  flex:1;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:rgba(255,255,255,0.7);
  font-size:24px;
  transition:all 0.2s;
}
.nav-btn:active{
  background:rgba(255,255,255,0.1);
  color:#fff;
}

/* MOBILE LAYOUT */
@media(max-width:768px){
  .menu-bar{display:none;}
  .ios-status{display:flex;}
  .desktop{padding-top:60px;padding-bottom:60px;}
  .app-icon{width:70px;}
  .icon-img{width:56px;height:56px;font-size:28px;border-radius:14px;}
  .app-name{font-size:11px;}
  .dock{display:none;}
  .android-nav{display:flex;}
  
  /* Mobile App Positions */
  .app-icon:nth-child(1){top:80px;left:30px;}
  .app-icon:nth-child(2){top:80px;left:120px;}
  .app-icon:nth-child(3){top:80px;left:210px;}
  .app-icon:nth-child(4){top:80px;left:300px;}
  .app-icon:nth-child(5){top:190px;left:30px;}
  .app-icon:nth-child(6){top:190px;left:120px;}
  .app-icon:nth-child(7){top:190px;left:210px;}
  .app-icon:nth-child(8){top:190px;left:300px;}
}

@media(max-width:428px){
  .app-icon:nth-child(1){top:70px;left:20px;}
  .app-icon:nth-child(2){top:70px;left:105px;}
  .app-icon:nth-child(3){top:70px;left:190px;}
  .app-icon:nth-child(4){top:70px;left:275px;}
  .app-icon:nth-child(5){top:170px;left:20px;}
  .app-icon:nth-child(6){top:170px;left:105px;}
  .app-icon:nth-child(7){top:170px;left:190px;}
  .app-icon:nth-child(8){top:170px;left:275px;}
}
</style>
</head>
<body>

<!-- REAL BOOT SCREEN - No Animation, Just Static -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-logo">Y<span class="at">@</span><span class="dollar">$</span>H</div>
  <div class="boot-powered">POWERED BY WEB OS</div>
</div>

<!-- BMW M4 Wallpaper -->
<div class="wallpaper"></div>

<!-- Mac OS Menu Bar - Desktop Only -->
<div class="menu-bar">
  <div class="menu-left">
    <div class="apple-logo">🍎</div>
    <div class="menu-item">Finder</div>
    <div class="menu-item">File</div>
    <div class="menu-item">Edit</div>
    <div class="menu-item">View</div>
  </div>
  <div class="menu-right">
    <div class="menu-time" id="menuTime">Mon 12:00 PM</div>
  </div>
</div>

<!-- iPhone Status Bar - Mobile Only -->
<div class="ios-status">
  <div id="iosTime">12:00</div>
</div>

<!-- Desktop Area with Spread Apps -->
<div class="desktop">
  <!-- YouTube -->
  <div class="app-icon" onclick="openApp('https://youtube.com')">
    <div class="icon-img youtube">▶️</div>
    <div class="app-name">YouTube</div>
  </div>

  <!-- Google -->
  <div class="app-icon" onclick="openApp('https://google.com')">
    <div class="icon-img google">G</div>
    <div class="app-name">Google</div>
  </div>

  <!-- Instagram -->
  <div class="app-icon" onclick="openApp('https://instagram.com')">
    <div class="icon-img instagram">📷</div>
    <div class="app-name">Instagram</div>
  </div>

  <!-- ChattingFly -->
  <div class="app-icon" onclick="openApp('https://chattingfly.netlify.app')">
    <div class="icon-img chat">💬</div>
    <div class="app-name">ChattingFly</div>
  </div>

  <!-- WhatsApp -->
  <div class="app-icon" onclick="openApp('https://web.whatsapp.com')">
    <div class="icon-img whatsapp">💚</div>
    <div class="app-name">WhatsApp</div>
  </div>

  <!-- Twitter -->
  <div class="app-icon" onclick="openApp('https://twitter.com')">
    <div class="icon-img twitter">🐦</div>
    <div class="app-name">Twitter</div>
  </div>

  <!-- GitHub -->
  <div class="app-icon" onclick="openApp('https://github.com')">
    <div class="icon-img github">🐙</div>
    <div class="app-name">GitHub</div>
  </div>

  <!-- Netflix -->
  <div class="app-icon" onclick="openApp('https://netflix.com')">
    <div class="icon-img netflix">N</div>
    <div class="app-name">Netflix</div>
  </div>
</div>

<!-- Mac OS Dock - Desktop Only -->
<div class="dock">
  <div class="dock-icon" onclick="openApp('https://youtube.com')" style="background:linear-gradient(135deg,#FF0000,#CC0000);">▶️</div>
  <div class="dock-icon" onclick="openApp('https://google.com')" style="background:#fff;color:#4285F4;">🔍</div>
  <div class="dock-icon" onclick="openApp('https://instagram.com')" style="background:linear-gradient(135deg,#833AB4,#FD1D1D);">📷</div>
  <div class="dock-icon" onclick="openApp('https://chattingfly.netlify.app')" style="background:linear-gradient(135deg,#22c55e,#16a34a);">💬</div>
</div>

<!-- Android Navigation Bar - 3 Dot -->
<div class="android-nav">
  <div class="nav-btn" onclick="goBack()">◀</div>
  <div class="nav-btn" onclick="goHome()">●</div>
  <div class="nav-btn" onclick="showRecent()">■</div>
</div>

<script>
// BOOT SCREEN - Show for 2 seconds then hide
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('bootScreen').classList.add('hide');
  }, 2000);
});

// OPEN APP - Same tab redirect
function openApp(url){
  window.location.href = url;
}

// ANDROID NAVIGATION
function goBack(){
  window.history.back();
}

function goHome(){
  window.location.href = window.location.origin + window.location.pathname;
}

function showRecent(){
  alert('Recent Apps\n\n1. YouTube\n2. Google\n3. Instagram\n4. ChattingFly');
}

// Update Time - Mac & iPhone
function updateTime(){
  const now = new Date();
  const options = {weekday:'short',hour:'2-digit',minute:'2-digit'};
  const timeStr = now.toLocaleDateString('en-US',options);
  const simpleTime = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('menuTime').textContent = timeStr;
  document.getElementById('iosTime').textContent = simpleTime;
}
setInterval(updateTime,1000);
updateTime();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if(e.metaKey || e.ctrlKey){
    if(e.key === '1') openApp('https://youtube.com');
    if(e.key === '2') openApp('https://google.com');
    if(e.key === '3') openApp('https://instagram.com');
    if(e.key === '4') openApp('https://chatingfly.netlify.app');
  }
});

// Haptic Feedback
if(/iPhone|iPad|iPod|Android/.test(navigator.userAgent)){
  document.querySelectorAll('.app-icon, .dock-icon, .nav-btn').forEach(el => {
    el.addEventListener('touchstart', () => {
      if(navigator.vibrate) navigator.vibrate(10);
    });
  });
}
</script>

</body>
</html>
